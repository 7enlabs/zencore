# Approval policy for ZenCore pull requests.
# Machine-readable mirror of the merge policy in AGENTS.md and REVIEW.md.
# Modelled on Claude Ship's `.claude/approvals.yml` (policy-as-code):
# version, mode (observe/enforce), rules with purpose, paths, verdict,
# override. Adapted to this team: the approving agent is the Leader, not
# Claude, so verdict uses `leader` instead of `claude`.
# Location note: this lives in docs/, not .zen/ — .zen/ is gitignored
# (local settings) and must never be committed.
# Extra key: `requires` lists the gates a rule needs beyond the verdict
# (mock-eval-100, doctor, mutants-caught, human-zen). A future merge-gate
# script can read this file and check them.
# If this file drifts from AGENTS.md, AGENTS.md wins and this file is the bug.
# Mode is observe: this file records what the policy WOULD decide. It does
# not block merges; the Leader still decides every merge. Switching to
# enforce needs a Zen decision (and branch protection on main, which the
# repo deliberately does not have today).
version: 1
mode: observe
rules:
  - purpose: "Every change needs Leader verification: CI green, fmt, clippy and tests pass, and the Leader reads the real output."
    paths: ["**"]
    verdict: { leader: comments, seats: 1 }
    override:
      - { if: "ci = pass and mutants = caught and review = pass", verdict: { leader: approves, seats: 1 } }

  - purpose: "Sensitive changes need a person (Zen): workflows, installer or release scripts, permissions, secrets, auto-update, or network calls to a new host."
    paths: [".github/workflows/**", "install.sh", "install.ps1", "scripts/**"]
    verdict: { leader: comments, seats: 2 }
    requires: [human-zen]

  - purpose: "Changes to the agent loop, tools, prompts, config, trust or permissions need the mock eval at 100% plus doctor. The Leader judges whether a change in these crates touches the loop."
    paths: ["crates/zen-agent/**", "crates/zen-core/**", "crates/zen-cli/**", "crates/zen-mcp/**", "crates/zen-tools/**"]
    verdict: { leader: comments, seats: 1 }
    requires: [mock-eval-100, doctor]
    override:
      - { if: "ci = pass and mutants = caught and review = pass and mock-eval = 100", verdict: { leader: approves, seats: 1 } }

  - purpose: "Changes to this policy file, AGENTS.md, REVIEW.md or CONTRIBUTING.md need two seats: the policy itself is protected."
    paths: ["docs/approvals.yml", "AGENTS.md", "REVIEW.md", "CONTRIBUTING.md"]
    verdict: { leader: comments, seats: 2 }
