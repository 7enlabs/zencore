name: Renovate (self-hosted pilot)

# Self-hosted Renovate: the job runs in this repo's own Actions, using the
# official renovatebot/github-action. No hosted Renovate GitHub App is
# installed on the org. Intended home once approved: .github/workflows/renovate.yml
# in 7enlabs/zencore (or a dedicated config repo), token in RENOVATE_TOKEN.

on:
  schedule:
    # Monday 05:30 Asia/Ho_Chi_Minh = Sunday 22:30 UTC
    - cron: '30 22 * * 0'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Renovate dry-run mode (full = propose only, no branches/PRs; false = run for real)'
        type: choice
        options:
          - full
          - extract
          - lookup
          - 'false'
        default: full

concurrency:
  group: renovate-self-hosted
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout runner config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Renovate (self-hosted)
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: renovate-pilot/config.js
          # Full image (not the slim default): the slim image has no Rust/cargo,
          # so every Cargo branch failed at the lock file update ("Lock file error").
          # The action builds the image as <renovate-image>:<renovate-version>,
          # so the -full variant goes in renovate-version, not in renovate-image.
          renovate-image: ghcr.io/renovatebot/renovate
          renovate-version: 39-full
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || 'false' }}
          LOG_LEVEL: info
