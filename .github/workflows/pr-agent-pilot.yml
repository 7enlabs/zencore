# PR Agent workflow (Route A: free-model PR review).
# Live on main: runs once per PR on opened / reopened / ready_for_review.
# Safety gates for Route A:
# - triggers only on opened / reopened / ready_for_review (no synchronize),
#   so one PR gets exactly one auto review comment
# - bot senders skipped
# - runtime image pinned by digest, never a rolling tag
# - auto-approval is OFF in .pr_agent.toml
# - all models are :free with multi-provider fallback; fail-closed on exhaustion
# - the repo must be checked out first: pr-agent determines the base repo
#   from git, and without a checkout it has no repo to review.
# - the image entrypoint is `python pr_agent/cli.py` (relative) with image
#   WORKDIR /app, but the runner forces --workdir /github/workspace, so the
#   relative path never resolves: `python: can't open file
#   '/github/workspace/pr_agent/cli.py'` (verified on runs 45185222255 and
#   45308766004, with and without a checkout). The step below overrides the
#   entrypoint to the absolute venv interpreter and passes the script by
#   absolute path, so the code runs from /app while the repo stays at
#   /github/workspace.
name: PR Agent (pilot)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    name: Run PR Agent (free-model pilot)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR Agent action step
        uses: docker://pragent/pr-agent@sha256:8978ae8f025883159ccc6f5bec51e6553347c77d14dbc5ca4bf3bb4a8726eb43
        with:
          # cli.py needs the command as a positional argument (it
          # errors with "the following arguments are required: command"
          # without one) and the PR URL, which it does not derive from
          # the GitHub event on its own: without --pr_url it only
          # prints help and exits. The pilot runs the review tool only.
          entrypoint: /app/.venv/bin/python
          args: /app/pr_agent/cli.py --pr_url=${{ github.event.pull_request.html_url }} review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # No config branch here on purpose: on main, repo settings are read
          # from the default branch, which is main itself. (The pilot branch
          # needed PR_AGENT_CONFIG_BRANCH only because its config was not on
          # main yet; that variable was removed before merge.)
          # Only the review tool runs: describe would rewrite the PR body and
          # code suggestions would add more comments. One PR, one review comment.
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
