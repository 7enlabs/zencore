  # EQUIVALENT (waived by ZC Leader, Telegram tin 13989, 2026-11-16;
  # proof verified against FIPS 180-4): the two operands are disjoint
  # by structure (e=1 makes the second operand 0, e=0 makes the first
  # operand 0), so ^ and | give the same result on every bit, and no
  # test can kill this mutant.
  # EXPIRY: if the ch expression is rewritten so the operands can
  # both be 1 for the same bit, or the hand-written SHA-256 is
  # replaced by a crate, this mutant stops being equivalent: remove
  # this exclusion and kill it with a test.
  "env_context\\.rs:352:30: replace \\^ with \\| in sha256_hex",
  # PR #213, env_context.rs sha256_hex maj (line 359, col 31 and 41):
