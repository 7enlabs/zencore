# cargo-mutants exclusions for the ZenCore workspace.
#
# Config file location: cargo-mutants reads .cargo/mutants.toml by
# default, so CI (plain cargo mutants --in-diff) picks this up.
# Each entry is a regex matched against the mutant name shown by
# cargo mutants --list.

exclude_re = [
  # PR #189, repl.rs is_current_model: replace || with &&.
  # EQUIVALENT (waived by ZC Leader, Telegram tin 11533-11534,
  # 2026-11-14; verified by SD Leader): every catalog entry has
  # gateway_id == id, and gateway_model_id returns its input
  # unchanged for ids outside the catalog, so for every row that
  # can reach this function gateway_model_id(row.id) == row.id
  # and the two sides of the || are always identical. Swapping
  # || for && therefore cannot change any observable behaviour,
  # and no test can kill this mutant.
  # EXPIRY: if the catalog gains an entry whose gateway_id differs
  # from its id, this mutant stops being equivalent: remove this
  # exclusion and kill it with a test where the current model equals
  # the gateway id but not the catalog id (or vice versa).
  "replace \\|\\| with && in is_current_model",
  # PR #214, session.rs TranscriptWriter::flush: replace flush with ().
  # EQUIVALENT (waived by ZC Leader, 2026-11-16; verified by independent
  # review of PR #214): append_line writes every record with
  # writeln!(w, ...) followed by w.flush(), so the buffer is always
  # empty when flush() runs; flush() is a no-op and replacing it with
  # () cannot change any observable behaviour, and no test can kill
  # this mutant.
  # EXPIRY: if append_line stops flushing after every record, this
  # mutant stops being equivalent: remove this exclusion and kill it
  # with a test that writes a record, calls flush, and checks the
  # bytes reach disk.
  "session\\.rs:411:9: replace TranscriptWriter::flush with \\(\\)",
  # PR #213, env_context.rs sha256_hex ch (line 352, col 30):
  # replace ^ with | in ch = (e & f) ^ ((!e) & g).
  # EQUIVALENT (waived by ZC Leader, Telegram tin 13989, 2026-11-16;
  # proof verified against FIPS 180-4): the two operands are disjoint
  # by structure (e=1 makes the second operand 0, e=0 makes the first
  # operand 0), so ^ and | give the same result on every bit, and no
  # test can kill this mutant.
  # EXPIRY: if the ch expression is rewritten so the operands can
  # both be 1 for the same bit, or the hand-written SHA-256 is
  # replaced by a crate, this mutant stops being equivalent: remove
  # this exclusion and kill it with a test.
  "env_context\\.rs:352:30: replace \\^ with \\| in sha256_hex",
  # PR #213, env_context.rs sha256_hex maj (line 359, col 31 and 41):
  # replace ^ with | in maj = (a & b) ^ (a & c) ^ (b & c).
  # EQUIVALENT (waived by ZC Leader, Telegram tin 13989, 2026-11-16;
  # proof verified against FIPS 180-4): only 0, 1 or 3 of the three
  # terms can be 1 at once (two terms being 1 forces the third to 1),
  # so XOR and OR agree on every input (0->0, 1->1, 3->1), and no
  # test can kill these mutants.
  # EXPIRY: if the maj expression is rewritten, or the hand-written
  # SHA-256 is replaced by a crate, these mutants stop being
  # equivalent: remove these exclusions and kill them with tests.
  "env_context\\.rs:359:31: replace \\^ with \\| in sha256_hex",
  "env_context\\.rs:359:41: replace \\^ with \\| in sha256_hex",
  # PR #226 (M3 Phase 2 #9), acp.rs run_prompt_turn (line 1058, col 21):
  # delete match arm "success" in run_prompt_turn.
  # EQUIVALENT (waived by ZC Leader, 2026-11-17; verified by reading
  # the match at acp.rs:1056-1065): the "success" arm returns
  # "end_turn", and the catch-all arm `_ => "end_turn"` also returns
  # "end_turn". Deleting the "success" arm makes "success" fall
  # through to the catch-all, which returns the same value, so no
  # observable behaviour changes and no test can kill this mutant.
  # EXPIRY: if the catch-all arm stops returning "end_turn", or the
  # "success" arm stops returning "end_turn", this mutant stops being
  # equivalent: remove this exclusion and kill it with a test where
  # the turn ends with subtype "success".
  "acp\\.rs:1058:21: delete match arm \"success\" in run_prompt_turn",
  # PR #227, lib.rs PermissionChecker::set_mode (line 694, col 9):
  # replace the default set_mode body with ().
  # EQUIVALENT (waived by ZC Leader, 2026-11-17; verified by
  # independent code review): the default body is `let _ = mode;`,
  # a no-op whose only purpose is to suppress the unused-parameter
  # warning (the doc comment says "Default no-op: a checker that
  # bakes no mode in has nothing to update"). Replacing the whole
  # body with () leaves an empty function that also returns () and
  # does nothing observable, so no test can kill this mutant.
  # EXPIRY: if the default set_mode gains real behaviour (e.g. it
  # stores the mode), this mutant stops being equivalent: remove
  # this exclusion and kill it with a test that calls the default
  # set_mode and checks the stored mode.
  # PR #228, acp.rs collect_listed_sessions (line 1500, col 41):
  # replace `activity > t` with `activity >= t`.
  # EQUIVALENT (waived by ZC Leader, 2026-11-18; verified by
  # independent code review): when activity == t, the original
  # `activity > t` is false so updated_at stays Some(t); with >= it
  # is true so updated_at is assigned Some(activity) == Some(t) -
  # the same value. The assignment is a no-op at equality, so no
  # test can kill this mutant.
  # EXPIRY: if the assignment on equality gains a different value
  # (e.g. it stores something other than activity itself), this
  # mutant stops being equivalent: remove this exclusion and kill
  # it with a test where two sessions share the same activity time.
  "acp\\.rs:1500:41: replace > with >= in collect_listed_sessions",
  "lib\\.rs:694:9: replace PermissionChecker::set_mode with \\(\\)",
]
